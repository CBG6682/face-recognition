<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực Giảng viên - FaceAttendance</title>
    <meta name="description" content="Đăng nhập hệ thống quản lý điểm danh khuôn mặt">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @import "tailwindcss";
        :root {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .font-mono {
            font-family: 'Geist Mono', monospace;
        }

        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 9999;
            pointer-events: none;
        }
        .toast {
            padding: 12px 18px;
            border-radius: 9999px;
            font-size: 0.8125rem;
            font-weight: 700;
            box-shadow: 0 12px 30px -4px rgba(0, 0, 0, 0.12);
            color: #111827;
            background: #ffffff;
            pointer-events: auto;
            border: 1px solid rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toast.toast-success { color: #065f46; border-color: rgba(16, 185, 129, 0.3); background: #ecfdf5; }
        .toast.toast-error { color: #9f1239; border-color: rgba(244, 63, 94, 0.3); background: #fff1f2; }
        .toast.toast-info { color: #1e3a8a; border-color: rgba(59, 130, 246, 0.3); background: #eff6ff; }
    </style>
</head>
<body class="bg-[#c8ff3d] text-zinc-900 flex flex-col justify-between min-h-[100dvh] antialiased p-6 sm:p-8">
    <!-- Top Bar -->
    <header class="w-full max-w-5xl mx-auto flex justify-between items-center">
        <a href="/" class="flex items-center gap-2 group">
            <span class="w-3 h-3 rounded-full bg-zinc-900 group-hover:scale-110 transition"></span>
            <span class="font-extrabold text-xl tracking-tight lowercase">face attend</span>
        </a>
        <div class="flex items-center gap-2">
            <span class="px-3.5 py-1.5 rounded-full bg-white/90 text-xs font-bold text-zinc-800 shadow-sm border border-black/5 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                kiosk online
            </span>
        </div>
    </header>

    <!-- Main Auth Card -->
    <main class="w-full max-w-[420px] mx-auto my-auto py-8">
        <div class="bg-white rounded-[32px] p-8 sm:p-9 shadow-[0_20px_60px_-15px_rgba(0,0,0,0.07)] border border-black/5">
            <!-- Header -->
            <div class="mb-6">
                <div class="flex items-center justify-between mb-4">
                    <span class="px-3 py-1 rounded-full bg-zinc-100 text-[11px] font-bold text-zinc-600 uppercase tracking-wider">
                        cổng giảng viên
                    </span>
                    <span class="w-8 h-8 rounded-full bg-[#c8ff3d] flex items-center justify-center font-bold text-xs text-black border border-black/10">
                        ⚡
                    </span>
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight text-zinc-950 lowercase mb-1">xác thực</h1>
                <p class="text-xs font-semibold text-zinc-400">Nhập mã truy cập để đăng nhập hệ thống quản lý</p>
            </div>

            <!-- Form -->
            <form id="login-form">
                <div class="space-y-1.5 mb-5">
                    <label class="block text-xs font-bold text-zinc-700" for="login-code">
                        Mã truy cập
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="login-code" 
                            class="w-full px-4 py-3 bg-zinc-100 hover:bg-zinc-100/80 focus:bg-white border-2 border-transparent focus:border-zinc-900 rounded-2xl text-zinc-900 font-mono text-sm placeholder:text-zinc-400 outline-none transition duration-150" 
                            placeholder="Nhập mã (mặc định: gv123)" 
                            required 
                            autofocus
                            autocomplete="current-password"
                        >
                    </div>
                </div>

                <div id="login-error" class="hidden text-rose-700 font-bold text-xs mb-4 p-3 bg-rose-50 border border-rose-200 rounded-2xl">
                </div>

                <button 
                    type="submit" 
                    id="btn-submit" 
                    class="w-full py-3.5 bg-zinc-900 hover:bg-black text-white font-bold text-xs uppercase tracking-wider rounded-full shadow-md transition duration-150 active:scale-[0.98] cursor-pointer flex items-center justify-center gap-2"
                >
                    <span>Đăng nhập hệ thống</span>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14"></path>
                        <path d="m12 5 7 7-7 7"></path>
                    </svg>
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-zinc-100 text-center">
                <a href="/" class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-zinc-100 hover:bg-zinc-200 text-xs font-bold text-zinc-700 transition duration-150">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m15 18-6-6 6-6"></path>
                    </svg>
                    <span>Quay lại camera điểm danh</span>
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-5xl mx-auto flex justify-between items-center text-[11px] font-bold text-zinc-800/80">
        <div>Hệ thống điểm danh sinh viên thông minh</div>
        <div class="flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-black"></span>
            <span>Edge AI Camera</span>
        </div>
    </footer>

    <div class="toast-container" id="toast-container"></div>

    <script src="/js/api.js?v=4.0"></script>
    <script>
        const form = document.getElementById('login-form');
        const codeInput = document.getElementById('login-code');
        const errorEl = document.getElementById('login-error');
        const submitBtn = document.getElementById('btn-submit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Đang xác thực...</span>';

            try {
                const res = await API.login(codeInput.value.trim());
                showToast(`Chào mừng ${res.ho_ten || 'Giảng viên'}!`, 'success');
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 350);
            } catch (err) {
                errorEl.textContent = 'Mã truy cập không hợp lệ. Vui lòng kiểm tra lại!';
                errorEl.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Đăng nhập hệ thống</span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>';
            }
        });
    </script>
</body>
</html>
