<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực Giảng viên - FaceAttendance</title>
    <meta name="description" content="Đăng nhập hệ thống quản lý điểm danh khuôn mặt">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @import "tailwindcss";
        :root {
            font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .font-mono {
            font-family: 'Geist Mono', monospace;
        }

        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 9999;
            pointer-events: none;
        }
        .toast {
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 0.8125rem;
            font-weight: 500;
            box-shadow: 0 10px 30px -4px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            color: #fff;
            pointer-events: auto;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toast.toast-success { background: rgba(6, 78, 59, 0.95); border-color: rgba(16, 185, 129, 0.25); }
        .toast.toast-error { background: rgba(136, 19, 55, 0.95); border-color: rgba(244, 63, 94, 0.25); }
        .toast.toast-info { background: rgba(18, 20, 29, 0.95); }
    </style>
</head>
<body class="bg-[#08090c] text-zinc-100 flex items-center justify-center min-h-[100dvh] antialiased selection:bg-blue-600/30 selection:text-blue-200">
    <!-- Subtle ambient backdrop illumination -->
    <div class="fixed inset-0 pointer-events-none flex items-center justify-center">
        <div class="w-[500px] h-[500px] bg-blue-600/5 blur-[120px] rounded-full"></div>
    </div>

    <main class="w-full max-w-[390px] px-5 relative z-10">
        <!-- Auth Card: Linear Dark Tech Surface -->
        <div class="bg-[#0e1017]/95 border border-white/[0.08] shadow-[inset_0_1px_0_rgba(255,255,255,0.06),0_24px_50px_-12px_rgba(0,0,0,0.8)] rounded-2xl p-7">
            <!-- Header & Security Emblem -->
            <div class="text-left mb-6">
                <div class="flex items-center justify-between mb-4">
                    <div class="w-9 h-9 rounded-xl bg-zinc-900 border border-white/10 flex items-center justify-center text-zinc-200 shadow-sm">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path>
                        </svg>
                    </div>
                    <span class="font-mono text-[11px] uppercase tracking-wider text-zinc-500 bg-zinc-900/60 border border-white/[0.05] px-2.5 py-1 rounded-md">
                        Console 2.0
                    </span>
                </div>
                <h1 class="text-lg font-semibold tracking-tight text-white mb-1">Xác thực Giảng viên</h1>
                <p class="text-xs text-zinc-400">Nhập mã truy cập để đăng nhập hệ thống quản lý</p>
            </div>

            <!-- Form -->
            <form id="login-form">
                <div class="space-y-1.5 mb-5">
                    <label class="block font-mono text-[11px] font-medium uppercase tracking-wider text-zinc-400" for="login-code">
                        Mã truy cập
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="login-code" 
                            class="w-full px-3.5 py-2.5 bg-zinc-900/80 border border-zinc-800 rounded-xl text-white font-mono text-sm placeholder:text-zinc-600 outline-none transition duration-150 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-400" 
                            placeholder="Nhập mã (mặc định: gv123)" 
                            required 
                            autofocus
                            autocomplete="current-password"
                        >
                    </div>
                </div>

                <div id="login-error" class="hidden text-rose-300 font-mono text-xs mb-4 p-2.5 bg-rose-500/10 border border-rose-500/20 rounded-xl">
                </div>

                <button 
                    type="submit" 
                    id="btn-submit" 
                    class="w-full py-2.5 bg-white hover:bg-zinc-200 text-zinc-950 font-semibold text-xs tracking-tight rounded-xl shadow-sm transition duration-150 active:scale-[0.98] cursor-pointer flex items-center justify-center gap-2"
                >
                    <span>Đăng nhập hệ thống</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14"></path>
                        <path d="m12 5 7 7-7 7"></path>
                    </svg>
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-white/[0.06] text-center">
                <a href="/" class="text-xs text-zinc-400 hover:text-zinc-200 inline-flex items-center gap-2 transition duration-150">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m15 18-6-6 6-6"></path>
                    </svg>
                    <span>Quay lại màn hình camera</span>
                </a>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toast-container"></div>

    <script src="/js/api.js?v=4.0"></script>
    <script>
        const form = document.getElementById('login-form');
        const codeInput = document.getElementById('login-code');
        const errorEl = document.getElementById('login-error');
        const submitBtn = document.getElementById('btn-submit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Đang xác thực...</span>';

            try {
                const res = await API.login(codeInput.value.trim());
                showToast(`Chào mừng ${res.ho_ten || 'Giảng viên'}!`, 'success');
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 350);
            } catch (err) {
                errorEl.textContent = 'Mã truy cập không hợp lệ. Vui lòng kiểm tra lại!';
                errorEl.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Đăng nhập hệ thống</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>';
            }
        });
    </script>
</body>
</html>
